# ===========================================================================
# Gui Araujo — deploy na Netlify
# ===========================================================================

[build]
  # `npm run build` = next build + serwist build (o service worker é montado
  # num passo próprio porque o Next 16 compila com Turbopack, e o plugin
  # webpack do Serwist não roda nesse modo).
  command = "npm run build"
  publish = ".next"

[build.environment]
  # O projeto exige Node 22 (o package.json trava em >=22).
  NODE_VERSION = "22"
  # Deploy não pode quebrar por warning de peer dependency.
  NPM_FLAGS = "--no-audit --no-fund"

# O runtime oficial do Next: cuida de SSR, Server Actions, middleware,
# ISR e das rotas dinâmicas. Sem ele o site sobe como estático e quebra.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ---------------------------------------------------------------------------
# Headers
#
# O next.config.ts já declara estes headers para o servidor Next. Repetir aqui
# cobre o caso de o arquivo ser servido pela CDN da Netlify antes de chegar no
# runtime — principalmente o sw.js, que preso em cache trava o app numa versão
# antiga para sempre.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ---------------------------------------------------------------------------
# Deploy previews
#
# Cada preview tem URL própria. O NEXT_PUBLIC_SITE_URL do painel aponta para
# produção, então aqui ele é sobrescrito pela URL do próprio preview — senão o
# link público da proposta gerado num preview apontaria para produção.
# ---------------------------------------------------------------------------

[context.deploy-preview.environment]
  NEXT_PUBLIC_SITE_URL = "$DEPLOY_PRIME_URL"

[context.branch-deploy.environment]
  NEXT_PUBLIC_SITE_URL = "$DEPLOY_PRIME_URL"
